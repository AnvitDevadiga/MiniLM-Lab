[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minilm-lab"
version = "0.1.0"
description = "A from-scratch, research-oriented mini language model lab"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
report = ["reportlab>=4", "cairosvg>=2.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
