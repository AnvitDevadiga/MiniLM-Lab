<svg xmlns="http://www.w3.org/2000/svg" width="760" height="348" viewBox="0 0 760 348" role="img" aria-labelledby="title desc">
<title id="title">KV-cache inference</title>
<desc id="desc">Cached decoding: one prefill pass builds per-layer keys and values, then each step processes one new token and appends its key and value. Uncached decoding recomputes the full window every step.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#ffffff" stroke="none"/></marker></defs>
<g fill="#ffffff" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<text stroke="none" x="20" y="16" font-size="12" font-weight="500" text-anchor="start" dominant-baseline="central">Cached  ·  forward_cached</text>
<rect x="20" y="32" width="190" height="58" rx="3" fill="none"/>
<text stroke="none" x="115.0" y="46.0" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central">Prefill</text>
<text stroke="none" x="115.0" y="61.0" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="central" fill-opacity="0.68">prompt of P tokens</text>
<text stroke="none" x="115.0" y="76.0" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="central" fill-opacity="0.68">one pass over all P positions</text>
<path d="M 210 61 L 262 61" fill="none" marker-end="url(#arrow)"/>
<rect x="262" y="32" width="210" height="58" rx="3" fill="none"/>
<text stroke="none" x="367.0" y="53.5" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central">KV cache, per layer</text>
<text stroke="none" x="367.0" y="68.5" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="central" fill-opacity="0.68">K, V: (B, 6, P, 32)</text>
<path d="M 472 61 L 524 61" fill="none" marker-end="url(#arrow)"/>
<rect x="524" y="32" width="216" height="58" rx="3" fill="none"/>
<text stroke="none" x="632.0" y="46.0" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central">Decode step</text>
<text stroke="none" x="632.0" y="61.0" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="central" fill-opacity="0.68">one new token (position P)</text>
<text stroke="none" x="632.0" y="76.0" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="central" fill-opacity="0.68">attends to the cache and itself</text>
<path d="M 632 90 L 632 112 L 367 112 L 367 90" fill="none" marker-end="url(#arrow)"/>
<text stroke="none" x="500" y="126" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="central" fill-opacity="0.68">append new k, v (torch.cat): cache grows by one position per token</text>
<text stroke="none" x="20" y="152" font-size="11" font-weight="400" text-anchor="start" dominant-baseline="central" fill-opacity="0.68">Beyond 128 tokens the cache is rebuilt from the last 128 tokens at every step (sliding window).</text>
<text stroke="none" x="20" y="196" font-size="12" font-weight="500" text-anchor="start" dominant-baseline="central">Uncached  ·  forward</text>
<rect x="20" y="212" width="452" height="58" rx="3" fill="none"/>
<text stroke="none" x="246.0" y="233.5" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central">Every step: full forward over the last ≤ 128 tokens</text>
<text stroke="none" x="246.0" y="248.5" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="central" fill-opacity="0.68">keys and values recomputed for every position</text>
<path d="M 472 241 L 524 241" fill="none" marker-end="url(#arrow)"/>
<rect x="524" y="212" width="216" height="58" rx="3" fill="none"/>
<text stroke="none" x="632.0" y="233.5" font-size="13" font-weight="500" text-anchor="middle" dominant-baseline="central">Logits at last position</text>
<text stroke="none" x="632.0" y="248.5" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="central" fill-opacity="0.68">→ next token</text>
<path d="M 632 270 L 632 292 L 246 292 L 246 270" fill="none" marker-end="url(#arrow)"/>
<text stroke="none" x="439" y="306" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="central" fill-opacity="0.68">append token, repeat</text>
<text stroke="none" x="20" y="336" font-size="11" font-weight="400" text-anchor="start" dominant-baseline="central" fill-opacity="0.68">Cache size: 2 × 4 layers × 192 values per position and sequence (fp32: 6,144 bytes).</text>
</g>
</svg>
