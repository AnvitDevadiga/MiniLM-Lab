.body{font:15px Arial,sans-serif;fill:#a9b8c9}
.small{font:13px Arial,sans-serif;fill:#a9b8c9}
.value{font:700 34px Arial,sans-serif;fill:#f4f7fb}
.axis{font:14px Arial,sans-serif;fill:#a9b8c9}
</style></svg>