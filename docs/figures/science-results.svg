<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" role="img" aria-labelledby="title desc">
<title id="title">Science prose language-model results</title><desc id="desc">Full held-out validation loss is 2.867 nats per token, 4.136 bits per byte. Median KV cache speedup is 3.58 times over 7 repeats.</desc>
<rect width="900" height="590" fill="white"/>
<text x="48" y="51" class="heading">Figure 2. Science prose experiment</text>
<text x="48" y="76" class="minor">Darwin + Einstein · held-out paragraphs · CPU · 4 validation checkpoints</text>
<line x1="48" y1="99" x2="852" y2="99" stroke="#111" stroke-width="1.2"/>
<text x="48" y="131" class="axis">A · Loss by optimizer step (nats/token)</text>
<line x1="92" y1="390.0" x2="496" y2="390.0" stroke="#dedede"/><text x="80" y="394.0" text-anchor="end" class="small">2.2</text><line x1="92" y1="274.0" x2="496" y2="274.0" stroke="#dedede"/><text x="80" y="278.0" text-anchor="end" class="small">3.0</text><line x1="92" y1="158.0" x2="496" y2="158.0" stroke="#dedede"/><text x="80" y="162.0" text-anchor="end" class="small">3.8</text>
<line x1="92" y1="390" x2="496" y2="390" stroke="#111"/>
<polyline points="193.0,268.9 294.0,267.2 395.0,265.0 496.0,325.7" fill="none" stroke="#111" stroke-width="2.5"/>
<polyline points="193.0,231.4 294.0,230.7 395.0,231.7 496.0,294.6" fill="none" stroke="#777" stroke-width="2.5" stroke-dasharray="8 5"/>
<text x="92" y="415" class="small">0</text><text x="496" y="415" text-anchor="end" class="small">1000 steps</text>
<line x1="92" y1="446" x2="117" y2="446" stroke="#111" stroke-width="2.5"/><text x="126" y="450" class="small">Train</text>
<line x1="192" y1="446" x2="217" y2="446" stroke="#777" stroke-width="2.5" stroke-dasharray="8 5"/><text x="226" y="450" class="small">Held-out</text>
<text x="555" y="131" class="axis">B · Decode latency, 96 tokens</text>
<text x="575" y="202" class="axis">Full-context</text><rect x="575" y="212" width="247.0" height="32" fill="#303030"/><text x="832.0" y="234" class="value">119 ms</text><text x="575" y="290" class="axis">KV cache</text><rect x="575" y="300" width="69.1" height="32" fill="#a8a8a8"/><text x="654.1" y="322" class="value">33 ms</text><text x="575" y="392" class="small">Median of 7 timed runs; one warm-up per mode</text>
<line x1="48" y1="478" x2="852" y2="478" stroke="#bbb"/>
<text x="48" y="512" class="value">17.58</text><text x="145" y="512" class="small">held-out perplexity</text>
<text x="374" y="512" class="value">4.14</text><text x="449" y="512" class="small">bits / byte</text>
<text x="650" y="512" class="value">3.58×</text><text x="719" y="512" class="small">cache speedup</text>
<text x="48" y="554" class="foot">Source: docs/data/science_run.json · One seed; descriptive results, not a confidence interval.</text>
<style>.heading{font:600 23px Arial,sans-serif;fill:#111}.axis{font:600 14px Arial,sans-serif;fill:#222}.value{font:600 17px Arial,sans-serif;fill:#111}.small{font:12px Arial,sans-serif;fill:#444}.minor{font:13px Arial,sans-serif;fill:#555}.foot{font:12px Arial,sans-serif;fill:#666}</style></svg>