<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 255" role="img" aria-labelledby="title desc">
<title id="title">MiniLM Lab decoder architecture</title><desc id="desc">UTF-8 input is embedded, processed by four causal decoder blocks, and projected to next-token logits with tied output weights.</desc>
<rect width="900" height="255" fill="white"/><text x="48" y="50" class="heading">Figure 1. Decoder architecture</text><text x="48" y="77" class="minor">The benchmark run uses learned positions, RMSNorm and SwiGLU.</text>
<rect x="70" y="110" width="150" height="82" fill="white" stroke="#1a1a1a" stroke-width="1.4"/><text x="145" y="143" text-anchor="middle" class="stage">Input</text><text x="145" y="167" text-anchor="middle" class="minor">UTF-8 bytes</text><path d="M226 151h42m-8-7 8 7-8 7" fill="none" stroke="#1a1a1a" stroke-width="1.4"/><rect x="270" y="110" width="150" height="82" fill="white" stroke="#1a1a1a" stroke-width="1.4"/><text x="345" y="143" text-anchor="middle" class="stage">Embedding</text><text x="345" y="167" text-anchor="middle" class="minor">token + position</text><path d="M426 151h42m-8-7 8 7-8 7" fill="none" stroke="#1a1a1a" stroke-width="1.4"/><rect x="470" y="110" width="150" height="82" fill="white" stroke="#1a1a1a" stroke-width="1.4"/><text x="545" y="143" text-anchor="middle" class="stage">Decoder × 4</text><text x="545" y="167" text-anchor="middle" class="minor">attention + SwiGLU</text><path d="M626 151h42m-8-7 8 7-8 7" fill="none" stroke="#1a1a1a" stroke-width="1.4"/><rect x="670" y="110" width="150" height="82" fill="white" stroke="#1a1a1a" stroke-width="1.4"/><text x="745" y="143" text-anchor="middle" class="stage">Output</text><text x="745" y="167" text-anchor="middle" class="minor">tied LM head</text><text x="48" y="228" class="foot">Each decoder block: RMSNorm → causal attention → residual → RMSNorm → SwiGLU → residual.</text>
<style>.heading{font:600 23px Arial,sans-serif;fill:#111}.stage{font:600 15px Arial,sans-serif;fill:#111}.minor{font:13px Arial,sans-serif;fill:#555}.foot{font:12px Arial,sans-serif;fill:#555}</style></svg>