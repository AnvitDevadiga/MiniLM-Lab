<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 944 398" role="img" aria-labelledby="title desc">
<title id="title">How MiniLM Lab works</title><desc id="desc">Read science text, convert it to bytes, predict the next byte with four decoder layers, and repeat predictions to generate text.</desc>
<rect width="944" height="398" rx="22" fill="#0b1018"/><text x="42" y="52" class="eyebrow">THE IDEA IN FOUR STEPS</text><text x="42" y="94" class="title">A tiny language model, end to end.</text><text x="42" y="126" class="subtitle">It learns which byte is likely to come next. Then it repeats.</text><rect x="42" y="168" width="193" height="145" rx="16" fill="#151d29" stroke="#2c394b"/><text x="62" y="202" fill="#67e8f9" class="eyebrow">01</text><text x="62" y="246" class="label">Read text</text><text x="62" y="278" class="body">Darwin + Einstein</text><path d="M240 240h19m-7-7 7 7-7 7" fill="none" stroke="#67e8f9" stroke-width="2"/><rect x="265" y="168" width="193" height="145" rx="16" fill="#151d29" stroke="#2c394b"/><text x="285" y="202" fill="#b8f28b" class="eyebrow">02</text><text x="285" y="246" class="label">Turn into bytes</text><text x="285" y="278" class="body">256 possible values</text><path d="M463 240h19m-7-7 7 7-7 7" fill="none" stroke="#67e8f9" stroke-width="2"/><rect x="488" y="168" width="193" height="145" rx="16" fill="#151d29" stroke="#2c394b"/><text x="508" y="202" fill="#ffd17a" class="eyebrow">03</text><text x="508" y="246" class="label">Predict next byte</text><text x="508" y="278" class="body">4 decoder layers</text><path d="M686 240h19m-7-7 7 7-7 7" fill="none" stroke="#67e8f9" stroke-width="2"/><rect x="711" y="168" width="193" height="145" rx="16" fill="#151d29" stroke="#2c394b"/><text x="731" y="202" fill="#67e8f9" class="eyebrow">04</text><text x="731" y="246" class="label">Generate text</text><text x="731" y="278" class="body">Repeat prediction</text><line x1="42" x2="902" y1="342" y2="342" stroke="#2c394b"/><text x="42" y="372" class="small">Inside the decoder: causal attention · RMSNorm · SwiGLU · tied output weights</text>
